<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>페이지를 찾을 수 없습니다 | 클립모아</title>
<style>
:root{--bg:#fbfaff;--text:#17132b;--muted:#524d6b;--accent:#5b2ee0;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f0c1d;--text:#f1eeff;--muted:#b9b3d6;--accent:#a58bff;--on:#120c2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.7;word-break:keep-all;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
svg{width:56px;height:56px}
.big{font-size:88px;font-weight:900;line-height:1.1;color:var(--accent);margin:8px 0}
h1{font-size:26px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:8px;background:var(--accent);color:var(--on);font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid var(--text);outline-offset:2px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect width="40" height="40" rx="10" fill="#5b2ee0"/><path d="M8 14V8h6M32 14V8h-6M8 26v6h6M32 26v6h-6" fill="none" stroke="#c6f135" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 14.5v11a1 1 0 0 0 1.5.9l9-5.5a1 1 0 0 0 0-1.8l-9-5.5a1 1 0 0 0-1.5.9z" fill="#fff"/></svg>
  <div class="big">404</div>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 없어진 페이지입니다.<br>홈에서 다시 찾아봐 주세요.</p>
  <a href="./">클립모아 홈으로</a>
</main>
</body>
</html>
